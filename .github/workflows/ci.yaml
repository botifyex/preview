name: CI

on:
  push:
    branches: [master]
    paths-ignore: &ignored
      - CHANGELOG.md
      - CONTRIBUTING.md
      - LICENSE
      - NOTICE
      - README.md
      - SECURITY.md
      - docs/**
  pull_request:
    paths-ignore: *ignored

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          cache-suffix: lint
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run basedpyright
      - run: uv lock --check

  test:
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
          cache-suffix: python-${{ matrix.python }}
      - run: uv sync --locked
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(uv run --no-sync playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - run: uv run --no-sync playwright install --with-deps chromium
      - run: uv run --no-sync pytest tests -n auto
