name: Docs

on:
  push:
    branches: [master]
    paths: &documents
      - CHANGELOG.md
      - CONTRIBUTING.md
      - LICENSE
      - NOTICE
      - README.md
      - SECURITY.md
      - docs/**
  pull_request:
    paths: *documents

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documents:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          cache-suffix: documents
      - run: uv sync --locked
      - run: >-
          uv run --no-sync pytest tests -n auto
          --ignore=tests/capture
          --deselect=tests/test_showcase.py::test_build_reproduces_the_committed_manifest
